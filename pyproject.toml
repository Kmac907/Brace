[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "brace"
version = "0.1.0"
description = "Branch-Safe Repository Agent Coordination Engine. Controlled agent workflows, from plan to merge."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.18,<5",
    "rich>=14,<15",
]

[project.urls]
Repository = "https://github.com/Kmac907/Brace"

[project.scripts]
brace = "brace.cli:main"

[tool.uv]
required-version = ">=0.12.9"
